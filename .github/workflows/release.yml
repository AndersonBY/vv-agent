name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example v0.1.39)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      UV_NO_SOURCES: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format --allow-onelevel "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Release tag $RELEASE_TAG resolves to $tag_commit, but checkout is $head_commit" >&2
            exit 1
          fi
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "Release tag $RELEASE_TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --locked --dev --extra s3

      - name: Verify locked contract snapshot
        run: python3 scripts/contract_snapshot.py check

      - name: Require centrally verified contract adoption
        run: python3 scripts/contract_snapshot.py adoption --implementation python --revision "$(git rev-parse HEAD)"

      - name: Run tests
        run: uv run pytest

      - name: Run linting
        run: uv run ruff check .

      - name: Run type check
        run: uv run ty check

      - name: Build package
        shell: bash
        run: |
          rm -rf dist
          uv build

      - name: Generate release notes
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_REF="$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)

          {
            echo "changelog<<EOF"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "## Changes since $PREVIOUS_TAG"
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${SOURCE_REF}"
            else
              echo "- Initial release"
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/" >&2
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          dist = Path("dist")
          artifacts = sorted([*dist.glob("*.whl"), *dist.glob("*.tar.gz")])
          manifest = {
              "package": tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["name"],
              "version": tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"],
              "artifacts": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in artifacts
              },
          }
          (dist / "release-artifacts.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          name: v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.artifacts.outputs.files }}
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Verify PyPI artifact hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = json.loads(Path("dist/release-artifacts.json").read_text(encoding="utf-8"))
          url = "https://pypi.org/pypi/{}/{}/json".format(
              urllib.parse.quote(expected["package"]),
              urllib.parse.quote(expected["version"]),
          )
          last_error = ""
          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  actual = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                      if isinstance(item.get("filename"), str)
                      and isinstance(item.get("digests"), dict)
                      and isinstance(item["digests"].get("sha256"), str)
                  }
                  if actual == expected["artifacts"]:
                      print("PyPI artifacts match locally built release hashes.")
                      break
                  last_error = "remote artifact names or hashes do not match the local build"
              except Exception as error:  # PyPI metadata can lag immediately after publication.
                  last_error = str(error)
              if attempt == 12:
                  raise SystemExit(f"PyPI verification failed after {attempt} attempts: {last_error}")
              time.sleep(5)
          PY
