name: Contract conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # Install PostgreSQL from the PGDG apt repository instead of pulling a container image:
      # anonymous registry pulls from shared runner IPs keep hitting rate limits.
      - name: Start PostgreSQL 18
        run: |
          set -euo pipefail
          # Drop the runner image's preinstalled clusters so 18/main takes port 5432.
          if command -v pg_lsclusters >/dev/null; then
            pg_lsclusters -h | while read -r ver name _; do sudo pg_dropcluster --stop "$ver" "$name"; done
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-18
          sudo pg_ctlcluster 18 main start || true
          pg_lsclusters
          sudo -u postgres psql -p 5432 -qc "ALTER USER postgres PASSWORD 'postgres'"
          pg_isready -h localhost -p 5432
          psql "$VV_AGENT_TEST_POSTGRES_DSN" -tAc 'SHOW server_version' | grep -q '^18\.'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Verify built distributions and every extra
        run: uv run --no-project python scripts/install_matrix.py

  conformance:
    runs-on: ubuntu-latest
    env:
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --dev --extra s3

      - name: Verify vendored contract snapshot
        run: python3 scripts/contract_snapshot.py check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Rebuild canonical producer evidence
        run: |
          uv run pytest \
            tests/test_builtin_tool_schema_generation.py \
            tests/test_parity_evidence_manifests.py \
            tests/test_tool_schema_contract.py \
            tests/test_tool_metadata_contract.py \
            tests/test_app_server_contract_parity.py \
            tests/test_runner_events_producer_parity.py
