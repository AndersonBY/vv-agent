name: Contract conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Verify built distributions and every extra
        run: uv run --no-project python scripts/install_matrix.py

  conformance:
    runs-on: ubuntu-latest
    env:
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --dev --extra s3

      - name: Verify vendored contract snapshot
        run: python3 scripts/contract_snapshot.py check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Rebuild canonical producer evidence
        run: |
          uv run pytest \
            tests/test_builtin_tool_schema_generation.py \
            tests/test_parity_evidence_manifests.py \
            tests/test_tool_schema_contract.py \
            tests/test_tool_metadata_contract.py \
            tests/test_app_server_contract_parity.py \
            tests/test_runner_events_producer_parity.py
